# Whole prototype in one command: docker compose up --build
# Open http://localhost:3000 when frontend is up.
# The first start downloads base images, npm, NuGet and pip packages, and the Qwen model (~3.5 GB).
# Database ml is created by POSTGRES_DB. src/postgres/initdb applies src/ml/sql to it and loads the registry mocks
# into database registries. Init scripts run only on an empty postgres-data volume.

name: smart-credit-portal

services:
  frontend:
    build:
      context: ./src/frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./src/backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Postgres__ConnectionString: Host=postgres;Port=5432;Username=${ML_POSTGRES_USER:-ml};Password=${ML_POSTGRES_PASSWORD:-change-me};Database=registries
      # PurposeHandoff posts here. Outside Compose appsettings.json points at http://localhost:8000.
      Ml__BaseUrl: http://ml:8000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ML_POSTGRES_USER:-ml}
      POSTGRES_PASSWORD: ${ML_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${ML_POSTGRES_DB:-ml}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./src/ml/sql:/ml-sql:ro
      - ./src/registries:/registries:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Product search: Qwen 3.5 in Ollama reads the pages, SearXNG finds them.
  ml:
    build:
      context: ./src/ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      ML_SEARXNG_URL: http://searxng:8080
      ML_OLLAMA_URL: http://ollama:11434
      ML_LLM_MODEL: ${ML_LLM_MODEL:-qwen3.5:4b}
      # Goods search jobs from the backend handoff are stored in database ml.
      ML_POSTGRES_HOST: postgres
      ML_POSTGRES_PORT: "5432"
      ML_POSTGRES_USER: ${ML_POSTGRES_USER:-ml}
      ML_POSTGRES_PASSWORD: ${ML_POSTGRES_PASSWORD:-change-me}
      ML_POSTGRES_DB: ${ML_POSTGRES_DB:-ml}
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully

  searxng:
    image: searxng/searxng:2026.10.17-2a6fc07be
    restart: unless-stopped
    volumes:
      - ./src/ml/searxng/settings.yml:/etc/searxng/settings.yml:ro

  ollama:
    image: ollama/ollama:0.40.9
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Downloads the model once into ollama-data, then exits. Later starts find it in place.
  ollama-pull:
    image: ollama/ollama:0.40.9
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${ML_LLM_MODEL:-qwen3.5:4b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  postgres-data:
  ollama-data:
